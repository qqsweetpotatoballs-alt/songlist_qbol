<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qbol 的夜歌本</title>
<meta name="description" content="Qbol 會唱的歌曲清單，可依語言、曲風、熟練度篩選。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single night-sky column — masthead, search & filter bar, then the song list as lined "pages" of a songbook */
:root{
  --night:#1b1411;      /* 夜色：深可可 */
  --night-2:#241b17;
  --surface:#2c221d;
  --line:#463830;
  --cream:#f3ead8;      /* 米白 */
  --cream-dim:#c9bca6;
  --yam:#e9a948;        /* 地瓜黃 */
  --yam-soft:rgba(233,169,72,.14);
  --cocoa:#b9906f;      /* 淺巧克力 */
  --cocoa-soft:rgba(185,144,111,.16);
  --danger:#e07a64;
  --f-display:"LXGW WenKai TC","Noto Serif TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--night);color:var(--cream);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:radial-gradient(1200px 500px at 85% -10%,rgba(233,169,72,.10),transparent 60%),
                   radial-gradient(900px 400px at -10% 0%,rgba(185,144,111,.10),transparent 60%);
  background-attachment:fixed;min-height:100%;
}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}

header.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px dashed var(--line)}
.moon{width:46px;height:46px;border-radius:50%;background:var(--yam);box-shadow:inset -12px -6px 0 0 var(--night),0 0 30px rgba(233,169,72,.35);flex:none}
.brand{display:flex;gap:14px;align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--cocoa);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.15;margin:2px 0 0;text-wrap:balance;color:var(--cream)}
h1 em{font-style:normal;color:var(--yam)}
.stats{display:flex;gap:18px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat b{font-size:22px;font-weight:500;color:var(--cream)}
.stat span{font-size:11px;letter-spacing:.08em;color:var(--cream-dim)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--night-2);color:var(--cream);font:inherit}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--cocoa)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--yam);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--cream);border-radius:12px;padding:10px 16px;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--cocoa)}
.btn.primary{background:var(--yam);color:#2a1a0c;border-color:var(--yam);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}

.filters{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:16px;background:var(--night-2);border:1px solid var(--line)}
.frow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.frow > span{font-size:12px;color:var(--cocoa);letter-spacing:.08em;padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{border:1px solid var(--line);background:transparent;color:var(--cream-dim);padding:4px 12px;border-radius:999px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--cocoa)}
.chip:hover{color:var(--cream);border-color:var(--cocoa)}
.chip[aria-pressed="true"]{background:var(--yam);border-color:var(--yam);color:#2a1a0c;font-weight:500}
.chip[aria-pressed="true"] i{color:#5a3c1a}
.fmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--cream-dim);border-top:1px dashed var(--line);padding-top:10px}
.linkbtn{background:none;border:0;color:var(--yam);padding:0;font-size:13px}

/* add / edit panel */
.panel{border-radius:16px;background:var(--surface);border:1px solid var(--cocoa);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--f-display);font-size:20px;margin:0;color:var(--yam)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .full{grid-column:1/-1}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--cream-dim);letter-spacing:.04em;min-width:0}
.fld input,.fld select,.fld textarea{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--night);color:var(--cream);font:inherit;font-size:15px;width:100%}
.fld textarea{resize:vertical;min-height:60px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px;margin:0}

/* pick banner */
.pick{border-radius:16px;padding:16px 18px;background:linear-gradient(120deg,var(--yam-soft),var(--cocoa-soft));border:1px solid var(--yam);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.pick .t{font-family:var(--f-display);font-size:24px;color:var(--yam);line-height:1.2}
.pick .a{color:var(--cream-dim);font-size:14px}

/* song list */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.song{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.song:first-child{border-top:1px solid var(--line)}
.no{font-family:var(--f-mono);font-size:13px;color:var(--cocoa);font-variant-numeric:tabular-nums;text-align:right}
.title{font-family:var(--f-display);font-size:19px;line-height:1.3;color:var(--cream);overflow-wrap:anywhere}
.artist{color:var(--cream-dim);font-size:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--cream-dim)}
.tag.lang{border-color:var(--cocoa);color:var(--cocoa)}
.note{font-size:12.5px;color:var(--cream-dim);margin-top:4px;opacity:.85}
.lvl{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dots{display:flex;gap:4px}
.dots b{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots b.on{background:var(--yam);box-shadow:0 0 8px rgba(233,169,72,.5)}
.lvl small{font-size:11.5px;color:var(--cream-dim)}
.row-act{display:flex;gap:4px}
.icon{background:none;border:1px solid transparent;color:var(--cream-dim);border-radius:8px;padding:3px 8px;font-size:12px}
.icon:hover{border-color:var(--line);color:var(--cream)}
.icon.del:hover{color:var(--danger)}
.confirm{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--danger)}

.empty{padding:36px 18px;text-align:center;color:var(--cream-dim);border:1px dashed var(--line);border-radius:16px}
.empty p{margin:4px 0}
.empty strong{font-family:var(--f-display);font-size:20px;color:var(--cream);font-weight:400}
.status{font-size:12px;color:var(--cocoa);text-align:center}

@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr;gap:4px}
  .frow > span{padding-top:0}
  .song{grid-template-columns:28px minmax(0,1fr);}
  .lvl{grid-column:2;flex-direction:row;align-items:center;justify-content:space-between}
  .stats{width:100%;justify-content:flex-start}
  .stat{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){#stars{display:none}}
.foot{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--cream-dim);padding-top:10px;border-top:1px dashed var(--line)}
code{font-family:var(--f-mono);font-size:.9em;color:var(--yam)}
</style>
<style>body{margin:0}:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="mast">
    <div class="brand">
      <div class="moon" aria-hidden="true"></div>
      <div>
        <div class="eyebrow">Night Songbook</div>
        <h1>Qbol 的<em>夜歌本</em></h1>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>首歌</span></div>
      <div class="stat"><b id="sGood">0</b><span>拿手</span></div>
      <div class="stat"><b id="sPractice">0</b><span>練習中</span></div>
    </div>
  </header>


  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋歌名或歌手" autocomplete="off">
    </div>
    <button class="btn ghost" id="pickBtn" type="button">隨機抽一首</button>
    <button class="btn primary" id="addBtn" type="button" hidden>＋ 新增歌曲</button>
  </div>

  <section class="panel" id="panel" hidden>
    <h2 id="panelTitle">新增歌曲</h2>
    <form id="form" class="grid" novalidate>
      <label class="fld"><span>歌名 *</span><input id="fTitle" required maxlength="80"></label>
      <label class="fld"><span>原唱／歌手</span><input id="fArtist" maxlength="80"></label>
      <label class="fld"><span>語言</span><select id="fLang"></select></label>
      <label class="fld"><span>曲風</span><select id="fGenre"></select></label>
      <label class="fld"><span>熟練度</span><select id="fLevel"></select></label>
      <label class="fld"><span>調性／備註</span><input id="fKey" maxlength="40" placeholder="例：降 2 Key、副歌要換氣"></label>
      <p class="err full" id="fErr" hidden></p>
      <div class="actions full">
        <button class="btn ghost" type="button" id="cancelBtn">取消</button>
        <button class="btn primary" type="submit" id="saveBtn">儲存</button>
      </div>
    </form>
  </section>

  <div class="pick" id="pick" hidden>
    <div><div class="eyebrow">今晚就唱</div><div class="t" id="pickT"></div><div class="a" id="pickA"></div></div>
    <button class="btn ghost" type="button" id="repick">再抽一次</button>
  </div>

  <section class="filters" aria-label="分類篩選">
    <div class="frow"><span>語言</span><div class="chips" id="cLang"></div></div>
    <div class="frow"><span>曲風</span><div class="chips" id="cGenre"></div></div>
    <div class="frow"><span>熟練度</span><div class="chips" id="cLevel"></div></div>
    <div class="fmeta"><span id="shown">顯示 0 首</span><button class="linkbtn" id="clear" type="button">清除篩選</button></div>
  </section>

  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" hidden></div>
  <p class="status" id="status">歌本載入中…</p>
  <footer class="foot"><span id="who"></span><button class="linkbtn" id="authBtn" type="button">歌手登入</button></footer>
</div>


<script type="module">
/* ===================================================================
   Firebase 專案：qbol-calendar
   =================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAsY6WdQW0FdetGcz15LOCcF2pcdR8asTo",
  authDomain: "qbol-calendar.firebaseapp.com",
  projectId: "qbol-calendar",
  storageBucket: "qbol-calendar.firebasestorage.app",
  messagingSenderId: "867195098890",
  appId: "1:867195098890:web:c4768e6866283744de4cf3"
};
/* 歌曲存放的 Firestore 集合名稱 */
const COLLECTION = "songbook";
/* 可以編輯歌單的帳號（要和 Firestore 規則裡的 Email 一致） */
const EDITORS = ["qqsweetpotatoballs@gmail.com"];

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, setDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const LANGS=["華語","日語","英語","台語","其他"];
const GENRES=["抒情","快歌","動漫","Vocaloid","古風","其他"];
const LEVELS=[{v:3,t:"拿手"},{v:2,t:"還行"},{v:1,t:"練習中"}];
const lvlName=v=>(LEVELS.find(l=>l.v===v)||{t:"—"}).t;
const $=id=>document.getElementById(id);

let songs=[], canEdit=false, editingId=null, confirmId=null;
const sel={lang:new Set(),genre:new Set(),level:new Set()};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const col=collection(db,COLLECTION);

function fillSelect(el,items){el.innerHTML="";items.forEach(i=>{const o=document.createElement("option");o.value=typeof i==="object"?i.v:i;o.textContent=typeof i==="object"?i.t:i;el.appendChild(o);});}
fillSelect($("fLang"),LANGS);fillSelect($("fGenre"),GENRES);fillSelect($("fLevel"),LEVELS);

function matches(s,skip){
  const q=$("q").value.trim().toLowerCase();
  if(q&&!((s.title||"")+" "+(s.artist||"")).toLowerCase().includes(q))return false;
  if(skip!=="lang"&&sel.lang.size&&!sel.lang.has(s.lang))return false;
  if(skip!=="genre"&&sel.genre.size&&!sel.genre.has(s.genre))return false;
  if(skip!=="level"&&sel.level.size&&!sel.level.has(String(s.level)))return false;
  return true;
}
function renderChips(boxId,key,items){
  const box=$(boxId);box.innerHTML="";
  items.forEach(it=>{
    const val=typeof it==="object"?String(it.v):it, label=typeof it==="object"?it.t:it;
    const n=songs.filter(s=>matches(s,key)&&String(s[key])===val).length;
    const b=document.createElement("button");b.type="button";b.className="chip";
    b.setAttribute("aria-pressed",sel[key].has(val));
    b.innerHTML=`<span></span><i>${n}</i>`;b.firstChild.textContent=label;
    b.onclick=()=>{sel[key].has(val)?sel[key].delete(val):sel[key].add(val);render();};
    box.appendChild(b);
  });
}
const filtered=()=>songs.filter(s=>matches(s)).sort((a,b)=>(b.level-a.level)||String(a.title).localeCompare(String(b.title),"zh-Hant"));

function render(){
  renderChips("cLang","lang",LANGS);renderChips("cGenre","genre",GENRES);renderChips("cLevel","level",LEVELS);
  $("sTotal").textContent=songs.length;
  $("sGood").textContent=songs.filter(s=>s.level===3).length;
  $("sPractice").textContent=songs.filter(s=>s.level===1).length;
  $("addBtn").hidden=!canEdit;
  const rows=filtered();
  $("shown").textContent=`顯示 ${rows.length} ／ ${songs.length} 首`;
  const list=$("list");list.innerHTML="";
  rows.forEach((s,i)=>{
    const li=document.createElement("li");li.className="song";
    li.innerHTML=`<div class="no">${String(i+1).padStart(2,"0")}</div>
      <div style="min-width:0"><div class="title"></div><div class="artist"></div>
        <div class="tags"><span class="tag lang"></span><span class="tag g"></span></div>
        <div class="note" hidden></div></div>
      <div class="lvl"><div style="display:flex;gap:8px;align-items:center"><small></small><div class="dots">${[1,2,3].map(n=>`<b class="${n<=s.level?"on":""}"></b>`).join("")}</div></div>
        <div class="row-act"></div></div>`;
    li.querySelector(".title").textContent=s.title;
    li.querySelector(".artist").textContent=s.artist||"—";
    li.querySelector(".tag.lang").textContent=s.lang;
    li.querySelector(".tag.g").textContent=s.genre;
    li.querySelector("small").textContent=lvlName(s.level);
    if(s.note){const n=li.querySelector(".note");n.hidden=false;n.textContent=s.note;}
    const act=li.querySelector(".row-act");
    if(canEdit){
      if(confirmId===s.id){
        act.innerHTML=`<span class="confirm">確定刪除？</span><button class="icon del" type="button">刪除</button><button class="icon" type="button">取消</button>`;
        const [y,n]=act.querySelectorAll("button");
        y.onclick=async()=>{confirmId=null;try{await deleteDoc(doc(db,COLLECTION,s.id));}catch(e){showErr(e);}};
        n.onclick=()=>{confirmId=null;render();};
      }else{
        act.innerHTML=`<button class="icon" type="button">編輯</button><button class="icon del" type="button">刪除</button>`;
        const [e,d]=act.querySelectorAll("button");
        e.onclick=()=>openPanel(s);d.onclick=()=>{confirmId=s.id;render();};
      }
    }
    list.appendChild(li);
  });
  const empty=$("empty");
  if(!songs.length){empty.hidden=false;empty.innerHTML=`<p><strong>歌本還是空白的</strong></p><p>${canEdit?"按上方「＋ 新增歌曲」寫下第一首會唱的歌。":"歌單正在整理中，晚點再來看看。"}</p>`;}
  else if(!rows.length){empty.hidden=false;empty.innerHTML=`<p><strong>沒有符合的歌曲</strong></p><p>換個篩選條件，或按「清除篩選」看全部。</p>`;}
  else empty.hidden=true;
}

function showErr(e){
  $("status").textContent = e&&e.code==="permission-denied"
    ? "這個帳號沒有編輯權限。請確認 Firestore 規則裡的 Email 是你登入的帳號。"
    : "儲存失敗，請稍後再試一次。";
}

function openPanel(s){
  editingId=s?s.id:null;
  $("panelTitle").textContent=s?"編輯歌曲":"新增歌曲";
  $("fTitle").value=s?s.title:"";$("fArtist").value=s?(s.artist||""):"";
  $("fLang").value=s?s.lang:"華語";$("fGenre").value=s?s.genre:"抒情";
  $("fLevel").value=s?String(s.level):"2";$("fKey").value=s?(s.note||""):"";
  $("fErr").hidden=true;$("panel").hidden=false;$("fTitle").focus();
}
$("addBtn").onclick=()=>openPanel(null);
$("cancelBtn").onclick=()=>{$("panel").hidden=true;editingId=null;};
$("clear").onclick=()=>{sel.lang.clear();sel.genre.clear();sel.level.clear();$("q").value="";render();};
$("q").addEventListener("input",render);

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const title=$("fTitle").value.trim();
  if(!title){$("fErr").textContent="請填寫歌名。";$("fErr").hidden=false;return;}
  const data={title,artist:$("fArtist").value.trim(),lang:$("fLang").value,genre:$("fGenre").value,level:Number($("fLevel").value),note:$("fKey").value.trim(),updatedAt:serverTimestamp()};
  $("saveBtn").disabled=true;
  try{
    if(editingId) await setDoc(doc(db,COLLECTION,editingId),data);
    else await addDoc(col,data);
    $("panel").hidden=true;editingId=null;
  }catch(err){
    $("fErr").textContent=err&&err.code==="permission-denied"?"這個帳號沒有編輯權限。":"儲存失敗，請稍後再試一次。";
    $("fErr").hidden=false;
  }finally{$("saveBtn").disabled=false;}
});

function pick(){
  const rows=filtered();
  if(!rows.length){$("pick").hidden=true;return;}
  const s=rows[Math.floor(Math.random()*rows.length)];
  $("pickT").textContent=s.title;$("pickA").textContent=[s.artist,s.lang,s.genre].filter(Boolean).join(" · ");
  $("pick").hidden=false;
}
$("pickBtn").onclick=pick;$("repick").onclick=pick;

/* 歌單：所有人都能即時讀取 */
onSnapshot(col,snap=>{
  songs=snap.docs.map(d=>({id:d.id,...d.data()}));
  $("status").textContent="";render();
},()=>{$("status").textContent="歌單暫時無法載入，請重新整理頁面。";});

/* 登入：只有登入的歌手會看到編輯按鈕；實際權限由 Firestore 規則決定 */
onAuthStateChanged(auth,u=>{
  canEdit=!!u && EDITORS.includes(u.email);
  $("who").textContent=u?(canEdit?`已登入：${u.email}`:`${u.email} 沒有編輯權限`):"";
  $("authBtn").textContent=u?"登出":"歌手登入";
  if(!u)$("panel").hidden=true;
  render();
});
$("authBtn").onclick=async()=>{
  try{ auth.currentUser ? await signOut(auth) : await signInWithPopup(auth,new GoogleAuthProvider()); }
  catch(e){ $("status").textContent="登入沒有完成，請再試一次。"; }
};

render();

/* 星空背景 */
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("stars"),x=c.getContext("2d");let st=[];
  function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;
    st=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*c.width,y:Math.random()*c.height*.8,r:(Math.random()*1.2+.3)*devicePixelRatio,p:Math.random()*6.28,s:.4+Math.random()}));}
  size();addEventListener("resize",size);
  (function f(t){x.clearRect(0,0,c.width,c.height);
    for(const s of st){const a=.25+.45*(.5+.5*Math.sin(t/1000*s.s+s.p));x.fillStyle=`rgba(243,234,216,${a})`;x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();}
    requestAnimationFrame(f);})(0);
})();
</script>
